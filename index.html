<head>

  <link rel="preload" href="fonts/Jost-Variable.woff2" as="font" type="font/woff2" crossorigin />

  <style>
    /* Cormorant Garamond + Jost (both SIL Open Font License), self-hosted */
    @font-face { font-family: "Cormorant Garamond"; src: url("fonts/CormorantGaramond-Variable.woff2") format("woff2"); font-weight: 300 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Cormorant Garamond"; src: url("fonts/CormorantGaramond-Italic-Variable.woff2") format("woff2"); font-weight: 300 700; font-style: italic; font-display: swap; }
    @font-face { font-family: "Jost"; src: url("fonts/Jost-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

    :root {
      --ivory: #f6f2ec;    /* boutique walls */
      --stone: #ece6dc;    /* alternate surface */
      --paper: #fffdf9;    /* cards */
      --line: #dcd3c6;     /* hairlines */
      --ink: #121212;      /* black: type, buttons */
      --graphite: #5d5852; /* secondary text */
      --navy: #26304a;     /* toile ink accent */
      --serif: "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif;
      --sans: "Jost", "Futura", "Century Gothic", ui-sans-serif, system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--ivory); -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100dvh; background: var(--ivory) url("img/toile-watermark.jpg") repeat center top / 980px auto; color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; font-weight: 400; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; overflow-x: hidden; }
    h1, h2, h3, p, ol, ul, figure { margin: 0; }
    ul, ol { padding: 0; list-style: none; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
    img, svg { display: block; }
    ::selection { background: var(--navy); color: var(--ivory); }
    :focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
    section[id] { scroll-margin-top: 84px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    .skip { position: fixed; top: 12px; left: 12px; z-index: 80; background: var(--ink); color: var(--ivory); padding: 10px 16px; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; white-space: nowrap; }
    .skip:focus { clip-path: none; width: auto; height: auto; }
    .serif { font-family: var(--serif); }
    .container { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
    @media (min-width: 640px) { .container { padding: 0 36px; } }
    .mozzy { pointer-events: none; user-select: none; height: auto; }
    /* Small tracked capitals: the boutique's signage voice. Used sparingly. */
    .caps { text-transform: uppercase; letter-spacing: .16em; font-size: 13px; font-weight: 500; }

    /* Buttons: squared, like a maison's */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 28px; border-radius: 2px; text-transform: uppercase; letter-spacing: .14em; font-size: 13px; font-weight: 600; white-space: nowrap; transition: background .25s, color .25s, border-color .25s; }
    .btn-black { background: var(--ink); color: var(--ivory); border: 1px solid var(--ink); }
    .btn-black:hover { background: var(--navy); border-color: var(--navy); }
    .btn-line { border: 1px solid var(--ink); color: var(--ink); }
    .btn-line:hover { background: var(--ink); color: var(--ivory); }
    .btn-ivory { background: var(--ivory); color: var(--ink); border: 1px solid var(--ivory); }
    .btn-ivory:hover { background: transparent; color: var(--ivory); }
    .btn svg { flex-shrink: 0; }


    /* Header */
    .site-header { display: none; position: relative; z-index: 30; background: rgb(246 242 236 / .88); border-bottom: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
    @media (min-width: 768px) { .site-header { display: block; position: sticky; top: 0; } }
    .site-header .container { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 72px; }
    .nav { display: none; gap: 28px; }
    .nav a { color: var(--graphite); } .nav a:hover { color: var(--ink); }
    .maison { grid-column: 2; font-family: var(--serif); font-size: 34px; line-height: 1; font-weight: 500; letter-spacing: .06em; }
    .header-dm { display: none; justify-self: end; grid-column: 3; }
    @media (min-width: 768px) { .nav { display: flex; } .header-dm { display: inline-flex; min-height: 42px; padding: 0 18px; } .maison { font-size: 38px; } }

    /* Hero */
    .hero { text-align: center; padding: 56px 0 72px; }
    @media (min-width: 640px) { .hero { padding: 88px 0 112px; } }
    .portrait { position: relative; width: 128px; height: 128px; margin: 0 auto; }
    .portrait img.avatar { width: 128px; height: 128px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 6px var(--ivory), 0 0 0 7px var(--ink); }
    .portrait .mozzy { position: absolute; width: 84px; right: -74px; bottom: -14px; }
    @media (min-width: 640px) { .portrait, .portrait img.avatar { width: 156px; height: 156px; } .portrait .mozzy { width: 104px; right: -96px; } }
    .hero .name { margin-top: 30px; font-family: var(--serif); font-size: clamp(76px, 20vw, 150px); line-height: .85; font-weight: 500; letter-spacing: -.01em; }
    .say { margin-top: 14px; font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--graphite); }
    .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; color: var(--graphite); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--navy); animation: beacon 2.6s ease-out infinite; }
    @keyframes beacon { 0% { box-shadow: 0 0 0 0 rgb(38 48 74 / .45); } 70% { box-shadow: 0 0 0 8px rgb(38 48 74 / 0); } 100% { box-shadow: 0 0 0 0 rgb(38 48 74 / 0); } }
    .rule { width: 56px; height: 1px; background: var(--ink); margin: 40px auto; border: 0; }
    .hero h1 { max-width: 16ch; margin: 0 auto; font-family: var(--serif); font-size: clamp(40px, 10vw, 68px); line-height: 1.04; font-weight: 500; letter-spacing: -.012em; text-wrap: balance; }
    .hero .lede { max-width: 40ch; margin: 22px auto 0; font-size: 17px; line-height: 1.7; color: var(--graphite); text-wrap: pretty; }
    @media (min-width: 640px) { .hero .lede { font-size: 19px; } }
    .hero-actions { display: flex; flex-direction: column; gap: 12px; max-width: 360px; margin: 36px auto 0; }
    @media (min-width: 640px) { .hero-actions { flex-direction: row; justify-content: center; max-width: none; } }
    .socials { display: flex; justify-content: center; gap: 10px; margin-top: 32px; }
    .social { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink); background: var(--paper); transition: background .25s, color .25s, border-color .25s; }
    .social:hover { background: var(--ink); color: var(--ivory); border-color: var(--ink); }

    /* Section headings */
    .section { padding: 72px 0; border-top: 1px solid var(--line); }
    @media (min-width: 640px) { .section { padding: 104px 0; } }
    .section-head { text-align: center; margin-bottom: 44px; }
    .section-head .mozzy { width: 96px; margin: 0 auto 18px; }
    .section-head h2 { font-family: var(--serif); font-size: clamp(44px, 11vw, 70px); line-height: 1; font-weight: 500; letter-spacing: -.01em; }
    .section-head p { margin-top: 14px; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--graphite); }
    @media (min-width: 640px) { .section-head { margin-bottom: 60px; } .section-head .mozzy { width: 112px; } }

    .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; } }
    @media (min-width: 1024px) { .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 768px) and (max-width: 1023px) { .grid.three > :last-child:nth-child(odd) { grid-column: span 2; } }

    /* Logo seals */
    .seal { display: grid; place-items: center; flex-shrink: 0; border-radius: 50%; border: 1px solid var(--ink); background: var(--paper); font-family: var(--serif); font-weight: 600; letter-spacing: .06em; overflow: hidden; box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 5px var(--line); }
    .seal img { width: 100%; height: 100%; object-fit: cover; }
    .seal.has-logo { border-radius: 16px; border-color: var(--line); box-shadow: 0 1px 0 rgb(18 18 18 / .04), 0 10px 24px -16px rgb(18 18 18 / .35); }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag { border: 1px solid var(--line); padding: 2px 10px; font-size: 13px; color: var(--graphite); background: var(--ivory); }
    .desc { margin-top: 20px; max-width: 52ch; font-size: 15px; line-height: 1.7; color: var(--graphite); }

    /* Exchange cards */
    .card { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); padding: 24px; transition: border-color .3s, box-shadow .3s, transform .3s; }
    .card:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: 0 24px 48px -32px rgb(18 18 18 / .35); }
    @media (min-width: 640px) { .card { padding: 32px; } }
    .card-top { display: flex; align-items: center; gap: 18px; }
    .card h3, .ticket h3 { font-family: var(--serif); font-size: 34px; line-height: 1.05; font-weight: 600; }
    .card-actions { margin-top: auto; padding-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    @media (min-width: 640px) { .card-actions { flex-direction: row; align-items: stretch; justify-content: space-between; } }
    .code-chip { display: inline-flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 52px; padding: 0 18px; border: 1px dashed #b9ae9e; background: var(--ivory); font-size: 13px; color: var(--graphite); transition: border-color .2s, background .2s; }
    .code-chip:hover { border-color: var(--ink); }
    .code-chip .code { margin-left: 10px; font-size: 17px; font-weight: 500; letter-spacing: .14em; color: var(--ink); }

    /* Copy states */
    .copy-side { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .14em; font-size: 12.5px; font-weight: 600; color: var(--ink); }
    .copy-icon { display: inline-grid; width: 16px; height: 16px; }
    .copy-icon svg { grid-area: 1 / 1; transition: transform .2s, opacity .2s; }
    .copy-icon .ic-check { opacity: 0; transform: scale(.5); }
    [data-state="copied"] { border-style: solid !important; border-color: var(--ink) !important; }
    [data-state="copied"] .ic-copy { opacity: 0; transform: scale(.5); }
    [data-state="copied"] .ic-check { opacity: 1; transform: scale(1); }

    /* Prop firm tickets: a boutique gift card with a tear-off stub */
    .ticket { display: flex; flex-direction: column; min-width: 0; transition: transform .3s; }
    .ticket:hover { transform: translateY(-2px); }
    .ticket-top, .ticket-stub { background: var(--paper); border: 1px solid var(--line); padding: 24px; transition: border-color .3s; }
    .ticket:hover .ticket-top, .ticket:hover .ticket-stub, .ticket:hover .arc { border-color: var(--ink); }
    @media (min-width: 640px) { .ticket-top, .ticket-stub { padding: 30px; } }
    .ticket-top { flex: 1; border-bottom: 0;
      -webkit-mask: radial-gradient(circle 12px at 0 100%, #0000 97%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle 12px at 100% 100%, #0000 97%, #000) 100% 0 / 51% 100% no-repeat;
              mask: radial-gradient(circle 12px at 0 100%, #0000 97%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle 12px at 100% 100%, #0000 97%, #000) 100% 0 / 51% 100% no-repeat; }
    .ticket-stub { position: relative; border-top: 0; background: var(--stone);
      -webkit-mask: radial-gradient(circle 12px at 0 0, #0000 97%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle 12px at 100% 0, #0000 97%, #000) 100% 0 / 51% 100% no-repeat;
              mask: radial-gradient(circle 12px at 0 0, #0000 97%, #000) 0 0 / 51% 100% no-repeat, radial-gradient(circle 12px at 100% 0, #0000 97%, #000) 100% 0 / 51% 100% no-repeat; }
    .ticket-stub::before { content: ""; position: absolute; top: 0; left: 22px; right: 22px; border-top: 1px dashed #b9ae9e; }
    .perf { position: relative; height: 0; z-index: 1; }
    .arc { position: absolute; top: 0; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); transition: border-color .3s; }
    .arc.l { left: 0; transform: translate(-50%, -50%); clip-path: inset(0 0 0 50%); }
    .arc.r { right: 0; transform: translate(50%, -50%); clip-path: inset(0 50% 0 0); }
    .ticket-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .ticket h3 { margin-top: 22px; }
    .host { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; color: var(--graphite); text-underline-offset: 4px; }
    .host:hover { color: var(--ink); text-decoration: underline; }
    .stub-label { display: flex; align-items: flex-end; justify-content: space-between; min-height: 22px; color: var(--graphite); }
    .perf-mozzy { position: absolute; right: 18px; top: -38px; width: 64px; z-index: 2; }
    @media (min-width: 640px) { .perf-mozzy { right: 24px; top: -44px; width: 72px; } }
    .code-slot { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 60px; margin-top: 10px; padding: 0 16px; border: 1px dashed #b9ae9e; background: var(--paper); text-align: left; transition: border-color .2s; }
    .code-slot:hover { border-color: var(--ink); }
    .code-slot .code { min-width: 0; font-size: 21px; line-height: 1; font-weight: 500; letter-spacing: .12em; }
    .code-slot .url { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    .ticket-stub .btn { width: 100%; margin-top: 16px; }

    /* Moments */
    .moments { display: grid; gap: 56px; max-width: 980px; margin: 0 auto; }
    @media (min-width: 768px) { .moments figure { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 64px; align-items: end; } .moments figcaption { padding: 0 0 24px; } }
    .frame { position: relative; background: var(--paper); border: 1px solid var(--line); padding: 12px; }
    .frame img.photo { width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; }
    .frame .mozzy { position: absolute; width: 104px; right: -12px; bottom: -40px; }
    @media (min-width: 640px) { .frame { padding: 16px; } .frame .mozzy { width: 128px; right: -28px; } }
    figcaption { margin-top: 26px; padding-right: 90px; }
    figcaption h3 { font-family: var(--serif); font-size: clamp(34px, 7vw, 48px); line-height: 1.05; font-weight: 500; }
    figcaption p { margin-top: 8px; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--graphite); }
    .moment-links { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; }
    figcaption .moment-links { font-family: var(--sans); font-style: normal; font-size: 13px; color: var(--ink); }
    .moment-links a { display: inline-flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
    .moment-links a:hover { color: var(--navy); border-color: var(--navy); }

    .moments figure.duo { display: block; }
    .duo-frame { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 640px) { .duo-frame { grid-template-columns: 1fr 1fr; gap: 16px; } }
    .frame img.photo.sq { aspect-ratio: 1 / 1; }
    .duo figcaption { display: grid; gap: 0; max-width: 760px; padding: 0 0 0 0; }
    figcaption .kicker { color: var(--graphite); font-family: var(--sans); font-style: normal; font-size: 13px; }
    .duo-frame.contain .mozzy { width: 84px; bottom: -46px; }
    @media (min-width: 640px) { .duo-frame.contain .mozzy { width: 120px; bottom: -40px; } }
    .duo figcaption h3 { margin-top: 8px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin: 22px 0 4px; border: 1px solid var(--line); background: var(--line); }
    .stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (min-width: 640px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .stats div { padding: 14px 12px; text-align: center; background: var(--paper); }
    .stats.four div:last-child dd { color: #1d6b45; }
    .shot { position: relative; }
    .shot-label { position: absolute; top: 10px; left: 10px; z-index: 1; padding: 4px 10px; background: var(--paper); color: var(--ink); font-size: 12px; }
    .duo-frame.contain .photo.sq { aspect-ratio: 4 / 3; object-fit: contain; background: #1e1f22; }
    .stats dt { font-size: 12px; color: var(--graphite); }
    .stats dd { margin: 6px 0 0; font-size: clamp(17px, 4.6vw, 24px); font-weight: 500; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .moments { gap: 88px; }

    /* Lead analyst badge */
    .role-wrap { margin-top: clamp(30px, 7vw, 52px); }
    .role { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; background: var(--ink); color: var(--ivory); border: 1px solid var(--ink); transition: background .25s, color .25s; }
    .role:hover { background: transparent; color: var(--ink); }
    .role .at { font-family: var(--serif); font-style: italic; font-size: 19px; line-height: 1; opacity: .75; }
    .role .org { font-family: var(--serif); font-size: 22px; line-height: 1; font-weight: 600; }

    /* Business line */
    .biz { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 6px 14px; margin-top: 28px; }
    .biz .caps { color: var(--graphite); }
    .biz a { font-family: var(--serif); font-size: 24px; font-weight: 600; border-bottom: 1px solid var(--ink); }
    .biz a:hover { color: var(--navy); border-color: var(--navy); }

    /* Help: the black salon */
    .help { background: var(--ink); color: var(--ivory); padding: 80px 0; }
    @media (min-width: 640px) { .help { padding: 112px 0; } }
    .help-grid { display: grid; gap: 56px; }
    @media (min-width: 1024px) { .help-grid { grid-template-columns: 1.05fr 1fr; gap: 80px; } }
    .help-title { display: flex; align-items: flex-end; gap: 12px; }
    .help-title .mozzy { width: 88px; flex-shrink: 0; }
    .help h2 { font-family: var(--serif); font-size: clamp(44px, 11vw, 70px); line-height: 1; font-weight: 500; }
    .help .intro { margin-top: 22px; max-width: 44ch; font-size: 17px; line-height: 1.7; color: rgb(246 242 236 / .78); }
    .help .btn-ivory { margin-top: 32px; width: 100%; }
    @media (min-width: 640px) { .help .btn-ivory { width: auto; } .help-title .mozzy { width: 110px; } }
    .help .secondary { margin-top: 20px; max-width: 46ch; font-family: var(--serif); font-style: italic; font-size: 21px; line-height: 1.55; color: rgb(246 242 236 / .7); }
    .contacts { margin-top: 40px; border-top: 1px solid rgb(246 242 236 / .18); }
    .contact { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid rgb(246 242 236 / .18); width: 100%; text-align: left; }
    .contact .who { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .contact .icon { display: grid; place-items: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; border: 1px solid rgb(246 242 236 / .3); }
    .contact .lbl { display: block; font-size: 13px; color: rgb(246 242 236 / .6); }
    .contact .handle { display: block; font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .contact .act { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .14em; font-size: 12.5px; font-weight: 600; }
    .contact:hover .icon { background: var(--ivory); color: var(--ink); }
    .contact[data-state="copied"] { border-color: rgb(246 242 236 / .18) !important; border-style: solid !important; }
    .steps-title { color: rgb(246 242 236 / .7); }
    .steps { margin-top: 24px; display: grid; gap: 18px; }
    .steps li { display: grid; grid-template-columns: 76px 1fr; gap: 18px; align-items: center; padding: 18px; border: 1px solid rgb(246 242 236 / .16); background: rgb(246 242 236 / .03); }
    .steps .art { display: block; width: 76px; height: 100px; }
    .steps .art img { width: 100%; height: 100%; object-fit: contain; }
    .steps .n { font-family: var(--serif); font-style: italic; font-size: 19px; color: rgb(246 242 236 / .6); }
    .steps .t { font-family: var(--serif); font-size: 28px; line-height: 1.1; font-weight: 600; }
    .steps .b { margin-top: 6px; font-size: 15px; line-height: 1.6; color: rgb(246 242 236 / .72); }

    footer .socials { margin-top: 28px; }
    .legal { display: grid; gap: 10px; max-width: 64ch; margin: 44px auto 0; font-size: 14px; line-height: 1.7; color: var(--graphite); }
    .legal strong { color: var(--ink); font-weight: 600; }
    .foot-bottom { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 28px; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 14px; color: var(--graphite); }
    .foot-bottom a:hover { color: var(--ink); }

    .fab[data-visible="true"] { opacity: 1; transform: none; pointer-events: auto; }
    @media (min-width: 768px) { .fab { display: none; } }

    /* Copy toast with the cheering Mozzy */
    .toast { position: fixed; left: 50%; bottom: max(84px, calc(env(safe-area-inset-bottom) + 72px)); z-index: 70; display: flex; align-items: center; gap: 12px; padding: 8px 20px 8px 8px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); box-shadow: 0 20px 50px -20px rgb(18 18 18 / .5); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; max-width: calc(100vw - 32px); }
    @media (min-width: 768px) { .toast { bottom: 32px; } }
    .toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }
    .toast img { width: 52px; height: auto; flex-shrink: 0; }
    .toast b { display: block; font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.15; }
    .toast span { display: block; font-size: 14px; color: var(--graphite); }



    /* Certificates: one quiet stack per prop firm */
    .certs { max-width: 980px; margin: 96px auto 0; padding-top: 28px; border-top: 1px solid var(--line); }
    .certs-title { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--graphite); }
    .cert-groups { display: grid; gap: 16px; margin-top: 16px; }
    @media (min-width: 640px) { .cert-groups { grid-template-columns: 1fr 1fr; gap: 20px; } }
    .cert-group { display: flex; align-items: center; gap: 22px; width: 100%; padding: 18px 20px; text-align: left; border: 1px solid var(--line); border-radius: var(--r-lg); background: rgb(255 253 249 / .75); transition: border-color .3s, background .3s; }
    .cert-group:hover, .cert-group:focus-visible { border-color: var(--ink); background: var(--paper); }
    .pile { position: relative; flex-shrink: 0; width: 112px; height: 84px; }
    .pile img { position: absolute; left: 6px; top: 6px; width: 96px; height: 70px; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 6px 14px -8px rgb(18 18 18 / .35); filter: grayscale(.85); opacity: .85; transition: transform .35s, filter .3s, opacity .3s; }

    .cg-text { display: grid; gap: 4px; min-width: 0; }
    .cg-firm { display: inline-flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.1; }
    .cg-firm img { width: 24px; height: 24px; border-radius: 6px; }
    .cg-sum { font-size: 14px; line-height: 1.45; color: var(--ink); }
    .cg-meta { font-size: 13px; color: var(--graphite); }
    .viewer { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 24px; background: rgb(18 18 18 / .82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .viewer[data-open="true"] { opacity: 1; pointer-events: auto; }
    .viewer figure { width: 100%; max-width: 1100px; margin: 0; }
    .viewer img { max-width: 100%; max-height: 80vh; margin: 0 auto; border-radius: 12px; box-shadow: 0 30px 80px -30px rgb(0 0 0 / .7); }
    .viewer figcaption { margin-top: 14px; padding: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 14px; color: var(--ivory); font-size: 14px; letter-spacing: .04em; text-align: center; }
    .viewer-count { opacity: .6; font-variant-numeric: tabular-nums; }
    .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; border-radius: 50%; background: rgb(246 242 236 / .92); color: var(--ink); font-size: 30px; line-height: 1; }

    .viewer-close { position: absolute; top: 16px; right: 16px; width: 48px; height: 48px; border-radius: 50%; background: var(--ivory); color: var(--ink); font-size: 28px; line-height: 1; }
    .pnl { margin-top: 18px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .pnl-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; color: var(--graphite); font-size: 12px; cursor: pointer; list-style: none; }

    #exchanges .grid { align-items: start; }
    .card-actions { flex-wrap: wrap; }

    .pnl-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 2px; }
    @media (min-width: 1024px) { .pnl-row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; } .pnl-item img { aspect-ratio: 1 / 1; } }
    .pnl-item { display: block; width: 100%; text-align: left; }
    .pnl-item img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 50% 6%; border-radius: 10px; border: 1px solid var(--line); background: #111; transition: transform .3s, box-shadow .3s; }
    .pnl-item:hover img, .pnl-item:focus-visible img { transform: translateY(-2px); box-shadow: 0 10px 22px -12px rgb(18 18 18 / .5); }
    .pnl-pct { display: block; margin-top: 6px; font-size: 15px; font-weight: 600; color: #1d6b45; font-variant-numeric: tabular-nums; }
    .pnl-pair { display: block; font-size: 12px; line-height: 1.3; color: var(--graphite); }
    /* Moments with Mazal: one mosaic */
    .moments figure.mosaic-wrap { display: block; }
    .mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mosaic .tile { position: relative; display: block; overflow: hidden; border-radius: var(--r-sm); background: #1e1f22; aspect-ratio: 1 / 1; }
    .mosaic .tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
    .mosaic .tile:hover img, .mosaic .tile:focus-visible img { transform: scale(1.04); }
    .mosaic .t0 { grid-column: 1 / -1; aspect-ratio: 4 / 3; }
    @media (min-width: 768px) {
      .mosaic { grid-template-columns: 1.15fr 1fr 1fr; grid-template-rows: auto auto; gap: 12px; }
      .mosaic .t0 { grid-column: 1; grid-row: 1 / span 2; aspect-ratio: auto; }
    }
    .mosaic .shot-label { top: auto; bottom: 8px; left: 8px; padding: 3px 10px; font-size: 12px; letter-spacing: .08em; white-space: nowrap; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; }
    .mosaic.n2 .t0, .mosaic.n4 .t0 { grid-column: auto; grid-row: auto; aspect-ratio: 1 / 1; }
    @media (min-width: 768px) { .mosaic.n2 { grid-template-columns: 1fr 1fr; } .mosaic.n4 { grid-template-columns: repeat(4, 1fr); } }
    .mosaic-wrap figcaption { max-width: 760px; padding: 0; margin-top: 30px; }
    .hl { display: grid; gap: 0; margin-top: 20px; border-top: 1px solid var(--line); }
    .hl li { display: grid; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    @media (min-width: 640px) { .hl li { grid-template-columns: 260px 1fr; gap: 20px; } }
    .hl b { font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.2; }
    .hl span { font-size: 15px; line-height: 1.6; color: var(--graphite); }
    .mosaic-wrap .moment-links { margin-top: 18px; }
    /* ── Refined corners: one radius scale for the whole site ── */
    :root { --r-lg: 18px; --r-md: 12px; --r-sm: 8px; }
    .btn, .header-dm { border-radius: var(--r-md); }
    .fab { border-radius: 14px; }

    .tag { border-radius: 999px; padding: 2px 12px; }
    .card { border-radius: var(--r-lg); box-shadow: 0 1px 2px rgb(18 18 18 / .04); }

    .frame img.photo { border-radius: var(--r-sm); }
    .shot-label { border-radius: 999px; padding: 4px 12px; top: 12px; left: 12px; }
    .stats { border-radius: var(--r-md); overflow: hidden; }
    .steps li { border-radius: var(--r-lg); }
    .toast { border-radius: 16px; }
    .toast img { border-radius: 0; }
    .contacts { border-radius: 0; }

    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    var REL = { referral: "sponsored noopener noreferrer", social: "me noopener noreferrer", plain: "noopener noreferrer" };
    function ext(url, kind) { return 'href="' + esc(url) + '" target="_blank" rel="' + REL[kind || "plain"] + '"'; }
    function host(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return url; } }
    function bare(url) { return url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""); }
    // Email: opens a ready-to-send message addressed to you.
    var MAIL_SUBJECT = (S.business && S.business.subject) || "Sponsorship / collaboration";
    function mailto(addr) { return "mailto:" + addr + "?subject=" + encodeURIComponent(MAIL_SUBJECT); }
    function gmailCompose(addr) { return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(addr) + "&su=" + encodeURIComponent(MAIL_SUBJECT); }
    var NEW_TAB = '<span class="sr-only"> (opens in a new tab)</span>';
    function sticker(n, extraClass, w) { return '<img class="mozzy ' + (extraClass || "") + '" src="' + STICKER(n) + '" alt="" width="' + (w || 240) + '" height="360" loading="lazy">'; }

    function seal(l, size) {
      var box = 'style="width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * .3) + 'px"';
      if (l && l.src) return '<span class="seal has-logo" ' + box + '><img src="' + esc(l.src) + '" alt="" width="' + size + '" height="' + size + '"></span>';
      return '<span class="seal" aria-hidden="true" ' + box + '>' + esc(l.monogram) + '</span>';
    }
    function copyBtn(cls, value, label, aria, inner, toastTitle) {
      return '<button type="button" class="' + cls + '" data-copy="' + esc(value) + '" data-label="' + esc(label) + '" data-toast="' + esc(toastTitle || "Copied") + '" aria-label="' + esc(aria) + '">' +
        inner + '<span class="copy-side">' + I.copy() + '<span class="copy-label">' + esc(label) + '</span></span></button>';
    }
    function socialIcons() {
      return '<ul class="socials" aria-label="Social media">' + S.contacts.filter(function (c) { return c.platform !== "phone"; }).map(function (c) {
        if (c.type === "copy") return '<li><button type="button" class="social" data-copy="' + esc(c.value) + '" data-toast="' + esc(c.label + " username copied") + '" aria-label="Copy ' + esc(c.label) + ' username ' + esc(c.handle) + '" title="' + esc(c.label + ": " + c.handle) + '">' + brand(c.platform, 18) + '</button></li>';
        if (c.url.indexOf("mailto:") === 0) return '<li><a class="social" href="' + esc(c.url) + '" aria-label="Email ' + esc(c.handle) + '" title="' + esc(c.label) + '">' + brand(c.platform, 18) + '</a></li>';
        return '<li><a class="social" ' + ext(c.url, "social") + ' aria-label="' + esc(S.profile.name + " on " + c.label) + '" title="' + esc(c.label) + '">' + brand(c.platform, 18) + '</a></li>';
      }).join("") + '</ul>';
    }
    function head(id, sec, n) {
      return '<header class="section-head">' + sticker(n) + '<h2 id="' + id + '">' + esc(sec.title) + '</h2><p>' + esc(sec.subtitle) + '</p></header>';
    }

    var p = S.profile, h = S.help;
    var GALLERIES = {};
    if (S.certificates) S.certificates.groups.forEach(function (g, gi) { GALLERIES["cert-" + gi] = { firm: g.firm, items: g.items }; });
    S.exchanges.forEach(function (e) {
      if (e.pnl && e.pnl.length) GALLERIES["pnl-" + e.id] = { firm: e.name, items: e.pnl.map(function (x) { return { src: x.src, label: x.pnl + " · " + x.pair + " · " + x.date, alt: e.name + " " + x.pair + " closed at " + x.pnl }; }) };
    });
    var out = "";

    /* Announcement strip + header */
    out += '<header class="site-header"><div class="container">' +
      '<nav class="nav caps" aria-label="Page sections"><a href="#exchanges">Exchanges</a><a href="#prop-firms">Prop firms</a><a href="#moments">Moments</a></nav>' +
      '<a class="btn btn-black header-dm" ' + ext(S.dm.url) + '>' + brand("messenger", 15) + 'DM me</a></div></header>';

    out += '<main id="main">';

    /* Hero */
    out += '<section class="hero container" id="top">' +
      '<div class="portrait"><img class="avatar" src="' + esc(p.avatar) + '" alt="Portrait of ' + esc(p.name) + '" width="156" height="156">' + sticker(1, "", 236) + '</div>' +
      '<p class="name">' + esc(p.name) + '</p>' +
      (p.role ? '<p class="role-wrap"><a class="role" ' + ext(p.role.url) + '><span class="caps">' + esc(p.role.title) + '</span><span class="at">at</span><span class="org">' + esc(p.role.org) + '</span>' + I.arrowUpRight(15) + NEW_TAB + '</a></p>' : '') +
      '<p class="status caps"><span class="dot" aria-hidden="true"></span>' + esc(p.status) + '</p>' +
      '<hr class="rule">' +
      '<h1>' + esc(p.headline) + '</h1>' +
      '<p class="lede">' + esc(p.description) + '</p>' +
      '<div class="hero-actions"><a class="btn btn-black" href="#exchanges">See my platforms' + I.arrowDown(16) + '</a>' +
      '<a class="btn btn-line" ' + ext(S.dm.url) + '>' + brand("messenger", 16) + 'Say hi</a></div>' +
      socialIcons() + '</section>';

    /* Exchanges */
    out += '<section class="section" id="exchanges" aria-labelledby="ex-title"><div class="container">' + head("ex-title", S.sections.exchanges, 4) + '<div class="grid">' +
      S.exchanges.map(function (e) {
        return '<article class="card" id="' + esc(e.id) + '">' +
          '<div class="card-top">' + seal(e.logo, 64) + '<div style="min-width:0"><h3>' + esc(e.name) + '</h3>' +
          '<ul class="tags" aria-label="' + esc(e.name) + ' features">' + (e.tags || []).map(function (t) { return '<li class="tag">' + esc(t) + '</li>'; }).join("") + '</ul></div></div>' +
          '<p class="desc">' + esc(e.description) + '</p>' +
          (e.pnl && e.pnl.length ? '<details class="pnl"><summary class="pnl-title caps"><span>Some of my best closes</span><svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><ul class="pnl-row">' + e.pnl.map(function (x, k) {
            return '<li><button type="button" class="pnl-item" data-gallery="pnl-' + esc(e.id) + '" data-start="' + k + '" aria-label="View ' + esc(e.name + " trade " + x.pair + " " + x.pnl) + '"><img src="' + esc(x.src) + '" alt="" loading="lazy"><span class="pnl-pct">' + esc(x.pnl) + '</span><span class="pnl-pair">' + esc(x.pair) + '</span></button></li>';
          }).join("") + '</ul></details>' : '') +
          '<div class="card-actions">' +
            (e.code ? copyBtn("code-chip", e.code, "Copy", "Copy " + e.name + " referral code " + e.code, '<span>Code<span class="code" data-copy-text>' + esc(e.code) + '</span></span>', e.name + " code copied") : "") +
            '<a class="btn btn-black" ' + ext(e.url, "referral") + '>' + esc(e.cta) + I.arrowUpRight(16) + NEW_TAB + '</a>' +
          '</div></article>';
      }).join("") + '</div></div></section>';

    /* Prop firms */
    out += '<section class="section" id="prop-firms" aria-labelledby="pf-title"><div class="container">' + head("pf-title", S.sections.propFirms, 8) + '<div class="grid three">' +
      S.propFirms.map(function (f) {
        var slot = f.code
          ? copyBtn("code-slot", f.code, "Copy", "Copy " + f.name + " referral code " + f.code, '<span class="code" data-copy-text>' + esc(f.code) + '</span>', f.name + " code copied")
          : copyBtn("code-slot", f.url, "Copy link", "Copy " + f.name + " referral link", '<span class="url" data-copy-text>' + esc(bare(f.url)) + '</span>', f.name + " link copied");
        return '<article class="ticket" id="' + esc(f.id) + '">' +
          '<div class="ticket-top"><div class="ticket-head">' + seal(f.logo, 60) + '<span class="tag">' + esc(f.kind) + '</span></div>' +
            '<h3>' + esc(f.name) + '</h3>' +
            '<p class="desc">' + esc(f.description) + '</p></div>' +
          '<div class="perf" aria-hidden="true"><span class="arc l"></span><span class="arc r"></span>' + (f.code ? "" : sticker(6, "perf-mozzy", 224)) + '</div>' +
          '<div class="ticket-stub"><p class="stub-label caps"><span>' + (f.code ? "My code, use it at checkout" : "No code needed, just tap below") + '</span></p>' + slot +
            '<a class="btn btn-black" ' + ext(f.url, "referral") + '>' + esc(f.cta) + I.arrowUpRight(16) + NEW_TAB + '</a></div>' +
        '</article>';
      }).join("") + '</div></div></section>';

    /* Moments */
    out += '<section class="section" id="moments" aria-labelledby="mo-title"><div class="container">' + head("mo-title", S.sections.moments, 9) + '<div class="moments">' +
      S.moments.map(function (m, mi) {
        if (m.mosaic) {
          var key = "moment-" + mi;
          GALLERIES[key] = { firm: m.title, items: m.images.map(function (im) { return { src: im.src, label: im.label, alt: im.alt }; }) };
          return '<figure class="mosaic-wrap"><div class="frame mosaic n' + m.images.length + '">' + m.images.map(function (im, k) {
              return '<button type="button" class="tile t' + k + '" data-gallery="' + key + '" data-start="' + k + '" aria-label="View ' + esc(im.label) + '"><img src="' + esc(im.src) + '" alt="' + esc(im.alt) + '" loading="lazy"' + (im.focus ? ' style="object-position:' + esc(im.focus) + '"' : '') + '><span class="shot-label caps">' + esc(im.label) + '</span></button>';
            }).join("") +
            (m.mozzy ? '<img class="mozzy" src="' + esc(m.mozzy) + '" alt="" width="240" height="360" loading="lazy">' : "") + '</div>' +
            '<figcaption><p class="kicker caps">' + esc(m.kicker) + '</p><h3>' + esc(m.title) + '</h3><p>' + esc(m.caption) + '</p>' +
            '<ul class="hl">' + m.highlights.map(function (x) { return '<li><b>' + esc(x.title) + '</b><span>' + esc(x.text) + '</span></li>'; }).join("") + '</ul>' +
            (m.links && m.links.length ? '<p class="moment-links caps">' + m.links.map(function (l) { return '<a ' + ext(l.url) + '>' + esc(l.label) + I.arrowUpRight(14) + NEW_TAB + '</a>'; }).join("") + '</p>' : "") +
            '</figcaption></figure>';
        }
        if (m.images) {
          return '<figure class="duo"><div class="frame duo-frame' + (m.fit === "contain" ? " contain" : "") + '">' + m.images.map(function (im) {
              return '<div class="shot">' + (im.label ? '<span class="shot-label caps">' + esc(im.label) + '</span>' : '') + '<img class="photo sq" src="' + esc(im.src) + '" alt="' + esc(im.alt) + '" width="1000" height="1000" loading="lazy"></div>';
            }).join("") +
            (m.mozzy ? '<img class="mozzy" src="' + esc(m.mozzy) + '" alt="" width="240" height="360" loading="lazy">' : "") + '</div>' +
            '<figcaption><p class="kicker caps">' + esc(m.kicker || "Highlight") + '</p><h3>' + esc(m.title) + '</h3><p>' + esc(m.caption) + '</p>' +
            (m.stats ? '<dl class="stats' + (m.stats.length === 4 ? ' four' : '') + '">' + m.stats.map(function (st) { return '<div><dt class="caps">' + esc(st.label) + '</dt><dd>' + esc(st.value) + '</dd></div>'; }).join("") + '</dl>' : "") +
            (m.links && m.links.length ? '<p class="moment-links caps">' + m.links.map(function (l) { return '<a ' + ext(l.url) + '>' + esc(l.label) + I.arrowUpRight(14) + NEW_TAB + '</a>'; }).join("") + '</p>' : "") +
            '</figcaption></figure>';
        }
        return '<figure><div class="frame"><img class="photo" src="' + esc(m.image) + '" alt="' + esc(m.alt) + '" width="1000" height="1250" loading="lazy" style="object-position:' + esc(m.focus || "50% 50%") + '">' +
          (m.mozzy ? '<img class="mozzy" src="' + esc(m.mozzy) + '" alt="" width="240" height="360" loading="lazy">' : "") + '</div>' +
          '<figcaption><h3>' + esc(m.title) + '</h3><p>' + esc(m.caption) + '</p>' +
          (m.links && m.links.length ? '<p class="moment-links caps">' + m.links.map(function (l) { return '<a ' + ext(l.url) + '>' + esc(l.label) + I.arrowUpRight(14) + NEW_TAB + '</a>'; }).join("") + '</p>' : "") +
          '</figcaption></figure>';
      }).join("") + '</div>' +
      (S.certificates ? '<div class="certs"><p class="certs-title">' + esc(S.certificates.title) + '</p><ul class="cert-groups">' + S.certificates.groups.map(function (g, gi) {
        var pile = g.items.slice(0, 3).map(function (it, k) { return '<img class="p' + k + '" src="' + esc(it.src) + '" alt="" loading="lazy">'; }).reverse().join("");
        return '<li><button type="button" class="cert-group" data-gallery="cert-' + gi + '" aria-label="View ' + g.items.length + ' ' + esc(g.firm) + ' certificates">' +
          '<span class="pile">' + pile + '</span>' +
          '<span class="cg-text"><span class="cg-firm">' + (g.logo ? '<img src="' + esc(g.logo) + '" alt="" width="24" height="24">' : '') + esc(g.firm) + '</span>' +
          '<span class="cg-sum">' + esc(g.summary) + '</span>' +
          '</span>' +
          '</button></li>';
      }).join("") + '</ul></div>' : '') +
      '</div></section>';

    /* Help */
    out += '<section class="help" id="help" aria-labelledby="help-title"><div class="container"><div class="help-grid">' +
      '<div><div class="help-title">' + sticker(2, "", 195) + '<h2 id="help-title">' + esc(h.headline) + '</h2></div>' +
        '<p class="intro">' + esc(h.description) + '</p>' +
        '<a class="btn btn-ivory" ' + ext(S.dm.url) + '>' + brand("messenger", 17) + esc(h.cta) + '</a>' +
        '<p class="secondary">' + esc(h.secondary) + '</p>' +
        '<div class="contacts">' + S.contacts.map(function (c) {
          var inner = '<span class="who"><span class="icon" aria-hidden="true">' + brand(c.platform, 17) + '</span><span style="min-width:0"><span class="lbl">' + esc(c.label) + '</span><span class="handle"' + (c.type === "copy" ? " data-copy-text" : "") + '>' + esc(c.handle) + '</span></span></span>';
          if (c.type === "copy") return '<button type="button" class="contact" data-copy="' + esc(c.value) + '" data-label="Copy" data-toast="' + esc(c.label + " copied") + '" aria-label="Copy ' + esc(c.label + " " + c.handle) + '">' + inner + '<span class="act copy-side" style="color:inherit">' + I.copy() + '<span class="copy-label">Copy</span></span></button>';
          var isMail = c.url.indexOf("mailto:") === 0;
          return '<a class="contact" ' + (isMail ? 'href="' + esc(c.url) + '"' : ext(c.url, "social")) + '>' + inner + '<span class="act">' + (isMail ? "Email" : "Open" + I.arrowUpRight(15)) + '</span>' + (isMail ? "" : NEW_TAB) + '</a>';
        }).join("") + '</div>' +
      '</div>' +
      '<div><h3 class="steps-title caps">Here’s how it goes</h3><ol class="steps">' + h.steps.map(function (s, i) {
        return '<li><span class="art" aria-hidden="true"><img src="' + esc(s.mozzy) + '" alt="" width="240" height="360" loading="lazy"></span><div><p class="n">Step ' + (i + 1) + '</p><p class="t">' + esc(s.title) + '</p><p class="b">' + esc(s.body) + '</p></div></li>';
      }).join("") + '</ol></div>' +
    '</div></div></section>';

    out += '</main>';

    /* Footer */
    out += '<footer id="site-footer"><div class="container">' + sticker(12, "", 228) +
      '<p class="maison-lg" aria-hidden="true">' + esc(p.name) + '</p>' +
      (S.business ? '<p class="biz"><span class="caps">' + esc(S.business.label) + '</span><a href="' + esc(mailto(S.business.email)) + '" data-email="' + esc(S.business.email) + '" aria-label="Email ' + esc(S.business.email) + ' about ' + esc(S.business.label.toLowerCase()) + '">' + esc(S.business.email) + '</a></p>' : '') +
      '<div class="legal"><p><strong>Risk disclaimer.</strong> ' + esc(S.footer.disclaimer) + '</p><p><strong>Referral disclosure.</strong> ' + esc(S.footer.disclosure) + '</p></div>' +
      '<div class="foot-bottom"><p>&copy; ' + new Date().getFullYear() + ' ' + esc(p.name) + '. All rights reserved.</p><a href="#top">Back to top</a></div></div></footer>';

    document.getElementById("app").innerHTML = out;

    /* Certificate viewer: flip through one firm's certificates */
    var viewer = document.getElementById("viewer");
    if (viewer) {
      var vImg = viewer.querySelector("img"), vCap = viewer.querySelector(".viewer-cap"), vCount = viewer.querySelector(".viewer-count");
      var prevB = viewer.querySelector(".viewer-prev"), nextB = viewer.querySelector(".viewer-next");
      var group = null, idx = 0, lastBtn = null;
      function show() {
        var it = group.items[idx];
        vImg.src = it.src; vImg.alt = it.alt || it.label;
        vCap.textContent = group.firm + " · " + it.label;
        vCount.textContent = (idx + 1) + " / " + group.items.length;
        var multi = group.items.length > 1;
        prevB.hidden = nextB.hidden = vCount.hidden = !multi;
      }
      function step(d) { if (!group) return; idx = (idx + d + group.items.length) % group.items.length; show(); }
      function closeViewer() { viewer.setAttribute("data-open", "false"); viewer.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; group = null; if (lastBtn) lastBtn.focus(); }
      document.querySelectorAll("[data-gallery]").forEach(function (b) {
        b.addEventListener("click", function () {
          group = GALLERIES[b.getAttribute("data-gallery")]; idx = +(b.getAttribute("data-start") || 0); lastBtn = b; show();
          viewer.setAttribute("data-open", "true"); viewer.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden";
          viewer.querySelector(".viewer-close").focus();
        });
      });
      viewer.setAttribute("aria-label", "Image viewer");
      prevB.addEventListener("click", function () { step(-1); });
      nextB.addEventListener("click", function () { step(1); });
      viewer.addEventListener("click", function (e) { if (e.target === viewer || e.target.closest(".viewer-close")) closeViewer(); });
      document.addEventListener("keydown", function (e) {
        if (viewer.getAttribute("data-open") !== "true") return;
        if (e.key === "Escape") closeViewer();
        if (e.key === "ArrowRight") step(1);
        if (e.key === "ArrowLeft") step(-1);
      });
      var sx = null;
      viewer.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
      viewer.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); sx = null; });
    }

    /* Floating DM (phones) */
    /* Email links: phones use the mail app; computers open a Gmail draft in a new tab
       (most desktops have no mail app set up, so mailto would do nothing). */
    document.querySelectorAll("[data-email]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) return;
        e.preventDefault();
        window.open(gmailCompose(a.getAttribute("data-email")), "_blank", "noopener");
      });
    });

    var fab = document.getElementById("fab");
    fab.href = S.dm.url;
    fab.innerHTML = brand("messenger", 17) + "Need a hand? Message me";
    if ("IntersectionObserver" in window) {
      var seen = new Map();
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { seen.set(e.target, e.isIntersecting); });
        var visible = !Array.from(seen.values()).some(Boolean);
        fab.setAttribute("data-visible", String(visible));
        fab.setAttribute("aria-hidden", String(!visible));
        fab.tabIndex = visible ? 0 : -1;
      });
      ["top", "help", "site-footer"].forEach(function (id) { io.observe(document.getElementById(id)); });
    }

    /* Copy to clipboard (with a fallback for Facebook/Instagram in-app browsers) */
    var toast = document.getElementById("toast"), toastTimer;
    function showToast(title, value, ok) {
      toast.innerHTML = '<img src="' + STICKER(ok ? 3 : 6) + '" alt="" width="249" height="360"><span><b>' + esc(ok ? title : "Couldn't copy") + '</b><span>' + esc(ok ? value : "Press and hold to copy: " + value) + '</span></span>';
      toast.setAttribute("data-show", "true");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.setAttribute("data-show", "false"); }, 2400);
    }
    function legacyCopy(text) {
      try {
        var f = document.createElement("textarea");
        f.value = text; f.setAttribute("readonly", ""); f.style.position = "fixed"; f.style.top = "0"; f.style.opacity = "0";
        document.body.appendChild(f); f.select(); f.setSelectionRange(0, text.length);
        var ok = document.execCommand("copy"); document.body.removeChild(f); return ok;
      } catch (e) { return false; }
    }
    function copy(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacyCopy(text); });
      return Promise.resolve(legacyCopy(text));
    }
    document.querySelectorAll("[data-copy]").forEach(function (btn) {
      var timer, label = btn.querySelector(".copy-label");
      btn.addEventListener("click", function () {
        var value = btn.getAttribute("data-copy");
        copy(value).then(function (ok) {
          showToast(btn.getAttribute("data-toast") || "Copied", value, ok);
          btn.setAttribute("data-state", ok ? "copied" : "failed");
          if (label) label.textContent = ok ? "Copied" : "Copy manually";
          if (!ok) {
            var t = btn.querySelector("[data-copy-text]"), sel = window.getSelection();
            if (t && sel) { var r = document.createRange(); r.selectNodeContents(t); sel.removeAllRanges(); sel.addRange(r); }
          }
          clearTimeout(timer);
          timer = setTimeout(function () { btn.removeAttribute("data-state"); if (label) label.textContent = btn.getAttribute("data-label"); }, 2200);
        });
      });
    });
  })();
  </script>
</body>
</html>
